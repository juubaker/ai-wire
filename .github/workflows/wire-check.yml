# A free scheduler for hosts whose own cron is too coarse (Vercel Hobby is
# once a day). GitHub's schedule fires on a best-effort basis and can lag under
# load, which is fine for a changelog: late is acceptable, wrong is not.
name: rebuild AI Wire

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the check
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.WIRE_CHECK_URL }}" \
            -H "authorization: Bearer ${{ secrets.CRON_SECRET }}"
